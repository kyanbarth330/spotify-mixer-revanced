name: Android emulator smoke tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'testhost/**'
      - 'tools/run_emulator_smoke.sh'
      - 'runtime/**'
      - 'shared-ui/**'
      - 'engine/**'
      - 'settings.gradle'
      - '.github/workflows/android-smoke.yml'
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enable KVM for the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run own fixture on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            bash tools/run_emulator_smoke.sh
      - name: Preserve own-code test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotenhancer-android35-smoke-evidence
          path: |
            emulator-evidence/
            testhost/build/reports/androidTests/
            testhost/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7
