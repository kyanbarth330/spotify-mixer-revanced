name: Own account service tests
on:
  push:
    paths: ['server/**', '.github/workflows/account-service.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/account-service.yml']
permissions:
  contents: read
jobs:
  php-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: own-fixture-only
          MYSQL_DATABASE: spotenhancer_fixture
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -prown-fixture-only" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      SE_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=spotenhancer_fixture;charset=utf8mb4
      SE_DB_USER: root
      SE_DB_PASSWORD: own-fixture-only
      SE_RATE_SECRET: own-disposable-fixture-rate-limit-key-2026
      SE_TEST_HTTP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
      - name: Lint PHP
        run: find server -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install own schema and start loopback-only service
        run: |
          php -r 'require "server/src/bootstrap.php"; db()->exec(file_get_contents("server/schema.sql"));'
          php -S 127.0.0.1:8080 -t server/public > /tmp/own-account-fixture.log 2>&1 &
          python3 -c 'import socket,time; time.sleep(1); socket.create_connection(("127.0.0.1",8080),5).close()'
      - name: Test real HTTP, Argon2id, MySQL authority and revocation
        run: python3 -m unittest discover -s server/tests -p integration.py -v
