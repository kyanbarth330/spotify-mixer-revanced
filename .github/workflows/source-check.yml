name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check research parsers and prohibited binaries
        run: |
          python3 -m unittest discover -s tools/tests
          if git ls-files | grep -Ei '\.(apk|p12|pk8|jks|keystore)$'; then
            echo 'APK or private key must not be committed'
            exit 1
          fi
