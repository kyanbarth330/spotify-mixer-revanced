name: Build SpotEnhancer installer
on:
  workflow_dispatch:
  push:
    paths:
      - 'installer/**'
      - 'engine/**'
      - 'runtime/**'
      - 'shared-ui/**'
      - 'shared-core/**'
      - 'tools/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-installer.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug installer
        run: gradle :engine:test :runtime:testDebugUnitTest :installer:assembleDebug --no-daemon
      - name: Check final installer runtime payload
        run: python3 tools/check_installer_runtime.py installer/build/outputs/apk/debug/installer-debug.apk
      - name: Validate delivered asset with Android patcher rules
        run: gradle :engine:validateInstallerRuntime -PinstallerApk="$PWD/installer/build/outputs/apk/debug/installer-debug.apk" --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: spotenhancer-installer
          path: installer/build/outputs/apk/debug/installer-debug.apk
          if-no-files-found: error
