name: Build Android Mixer installer
on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - 'installer/**'
      - 'payload/**'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/build-installer.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug installer
        run: gradle :installer:assembleDebug :installer:testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: spotify-mixer-installer-experimental
          path: installer/build/outputs/apk/debug/installer-debug.apk
          if-no-files-found: error
  android-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: gradle :installer:connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-signing-smoke-results
          path: installer/build/reports/androidTests/connected/
