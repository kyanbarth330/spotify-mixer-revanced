plugins { id 'com.android.application' }
android {
    namespace 'org.example.spotifymixer.patcher'
    compileSdk 35
    sourceSets.main.java.srcDir('../shared-ui/src/main/java')
    defaultConfig {
        applicationId 'org.example.spotifymixer.patcher'
        minSdk 24
        targetSdk 28
        versionCode 8
        versionName '0.8'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation project(':engine')
    implementation 'androidx.core:core:1.13.1'
}
// Bundle only our original UI DEX, never a Spotify APK.
def runtimeAssets = layout.buildDirectory.dir('generated/runtimeAssets')
android.sourceSets.main.assets.srcDir(runtimeAssets)
tasks.register('bundleMixerRuntime') {
    dependsOn ':runtime:assembleDebug'
    inputs.file(project(':runtime').layout.buildDirectory.file('outputs/apk/debug/runtime-debug.apk'))
    outputs.dir(runtimeAssets)
    doLast {
        def apk = project(':runtime').file('build/outputs/apk/debug/runtime-debug.apk')
        def out = runtimeAssets.get().file('mixer-runtime.zip').asFile
        out.parentFile.mkdirs()
        // Debug builds can put R in classes.dex and Mixer in classes2.dex.
        // Preserve every DEX, including D8-generated lambda/anonymous classes.
        new File(out.parentFile, 'mixer.dex').delete()
        def source = new java.util.zip.ZipFile(apk)
        try {
            def names = source.entries().findAll { it.name ==~ /classes([0-9]+)?\.dex/ }.collect { it.name }.sort()
            if (names.isEmpty()) throw new GradleException('Runtime APK contains no DEX')
            out.withOutputStream { stream ->
                def zip = new java.util.zip.ZipOutputStream(stream)
                try {
                    names.each { name ->
                        zip.putNextEntry(new java.util.zip.ZipEntry(name))
                        source.getInputStream(source.getEntry(name)).withCloseable { zip << it }
                        zip.closeEntry()
                    }
                } finally { zip.close() }
            }
        } finally { source.close() }
    }
}
tasks.named('preBuild').configure { dependsOn 'bundleMixerRuntime' }
