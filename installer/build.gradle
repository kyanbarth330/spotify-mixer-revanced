plugins { id 'com.android.application' }
android {
    namespace 'org.example.spotifymixer.patcher'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'org.example.spotifymixer.patcher'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        minSdk 24
        targetSdk 28
        versionCode 2
        versionName '0.2-experimental'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'org.smali:dexlib2:2.5.2'
    implementation 'com.google.guava:guava:33.3.1-android'
    implementation 'com.android.tools.build:apksig:8.7.3'
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
// Only the payload DEX is bundled; never the user's Spotify APK.
def payloadAssets = layout.buildDirectory.dir('generated/payloadAssets')
android.sourceSets.main.assets.srcDir(payloadAssets)
tasks.register('preparePayload') {
    dependsOn ':payload:assembleRelease'
    inputs.file(project(':payload').layout.buildDirectory.file('outputs/apk/release/payload-release-unsigned.apk'))
    outputs.dir(payloadAssets)
    doLast {
        def apk = project(':payload').layout.buildDirectory.file('outputs/apk/release/payload-release-unsigned.apk').get().asFile
        if (zipTree(apk).matching { include 'classes*.dex' }.files.size() != 1) throw new GradleException('Payload must contain exactly one DEX')
        copy { from zipTree(apk); include 'classes.dex'; into payloadAssets; rename 'classes.dex', 'mixer.dex' }
    }
}
tasks.named('preBuild').configure { dependsOn 'preparePayload' }

android.sourceSets.androidTest.assets.srcDir(layout.buildDirectory.dir('generated/smokeAssets'))
tasks.register('prepareSmokeFixture') {
    dependsOn ':payload:assembleRelease'
    inputs.file(project(':payload').layout.buildDirectory.file('outputs/apk/release/payload-release-unsigned.apk'))
    outputs.dir(layout.buildDirectory.dir('generated/smokeAssets'))
    doLast {
        copy {
            from project(':payload').layout.buildDirectory.file('outputs/apk/release/payload-release-unsigned.apk')
            into layout.buildDirectory.dir('generated/smokeAssets')
            rename 'payload-release-unsigned.apk', 'fixture.apk'
        }
    }
}
tasks.configureEach { if (name == 'mergeDebugAndroidTestAssets') dependsOn 'prepareSmokeFixture' }
