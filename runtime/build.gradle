plugins { id 'com.android.application' }
android {
    namespace 'org.example.spotifymixer.runtime'
    compileSdk 35
    sourceSets.main.java.srcDir('../shared-ui/src/main/java')
    defaultConfig { applicationId 'org.example.spotifymixer.runtime'; minSdk 24; targetSdk 28; versionCode 1; versionName '1' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation project(':shared-core')
    testImplementation 'junit:junit:4.13.2' }
